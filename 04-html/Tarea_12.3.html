<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rellena tu CV</title>
</head>
<body>
    <header>
        <a href="index_Ejercios.html">Volver atras</a>
    </header>
        

<h1>Rellena tu CV</h1>

<form action="" method="get">

    <fieldset>

        <legend>Datos personales</legend>

        <p>
            <label for="provincia">Provincia</label><br>

            <select id="provincia" name="provincia">
                <option>- selecciona -</option>
                <option>Alicante</option>
                <option>Madrid</option>
                <option>Sevilla</option>
                <option>Valencia</option>
            </select>

        </p>

        <p>

            <label>Fecha de nacimiento</label><br>

            <input type="number" name="dia" min="1" max="31" size="2">

            de

            <select name="mes">
                <option>Enero</option>
                <option>Febrero</option>
                <option>Marzo</option>
                <option>Abril</option>
                <option>Mayo</option>
                <option>Junio</option>
                <option>Julio</option>
                <option>Agosto</option>
                <option>Septiembre</option>
                <option>Octubre</option>
                <option>Noviembre</option>
                <option>Diciembre</option>
            </select>

            de

            <input type="number" name="anio" min="1900" max="2100">

        </p>

        <p>

            <label for="intereses">Temas de interés</label><br>

            <select id="intereses" name="intereses" size="6" multiple>

                <option>Administración de bases de datos</option>
                <option>Análisis y programación</option>
                <option>Arquitectura</option>
                <option>Calidad</option>
                <option>ERP, CRM, Business Intelligence</option>
                <option>Seguridad informática</option>
                <option>Redes</option>
                <option>Desarrollo Web</option>

            </select>

        </p>

    </fieldset>

</form>

</body>
</html>
