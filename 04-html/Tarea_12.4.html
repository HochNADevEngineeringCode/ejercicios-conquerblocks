<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Información sobre el producto</title>
</head>
<body>
    <header>
        <a href="index_Ejercios.html">Volver atras</a>
    </header>

<h1>Información sobre el producto</h1>

<form action="" method="get">

    <fieldset>

        <legend>Datos básicos</legend>

        <p>

            <label for="nombre">Nombre</label><br>

            <input type="text" id="nombre" name="nombre">

        </p>

        <p>

            <label for="descripcion">Descripción</label><br>

            <textarea id="descripcion" name="descripcion" rows="5" cols="35"></textarea>

        </p>

        <p>

            <label for="foto">Foto</label>

            <input type="file" id="foto" name="foto">

        </p>

        <p>

            <input type="checkbox" id="contador" name="contador">

            <label for="contador">Añadir contador de visitas</label>

        </p>

    </fieldset>

    <br>

    <fieldset>

        <legend>Datos económicos</legend>

        <p>

            <label for="precio">Precio</label>

            <input type="number" id="precio" name="precio">

            €

            &nbsp;&nbsp;

            <label for="impuesto">Impuestos</label>

            <select id="impuesto" name="impuesto">
                <option>4%</option>
                <option>7%</option>
                <option>16%</option>
                <option>25%</option>
            </select>

        </p>

        <p>

            <label>Promoción</label><br>

            <input type="radio" id="ninguno" name="promo" checked>
            <label for="ninguno">Ninguno</label><br>

            <input type="radio" id="transporte" name="promo">
            <label for="transporte">Transporte gratuito</label><br>

            <input type="radio" id="descuento" name="promo">
            <label for="descuento">Descuento 5%</label>

        </p>

    </fieldset>

</form>

</body>
</html>
